server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La SPA no tiene enrutador: cualquier ruta desconocida devuelve el index igualmente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sirviendo API y web bajo el mismo origen, CORS deja de intervenir.
    location /api/ {
        proxy_pass http://misfinanzas-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://misfinanzas-api:8080/health;
    }
}
