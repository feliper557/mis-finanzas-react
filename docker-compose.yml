# Entorno local: PostgreSQL y la API. La SPA se levanta aparte con "npm run dev", igual que
# en produccion, donde la sirve Netlify y la API vive en Cloud Run.
#
#   docker compose up --build        -> base en 5433, API en 8081
#   npm run dev                      -> SPA en 5173
name: misfinanzas-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: misfinanzas
      POSTGRES_USER: misfinanzas
      POSTGRES_PASSWORD: misfinanzas
    ports:
      - "5433:5432"
    volumes:
      - misfinanzas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misfinanzas -d misfinanzas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=misfinanzas;Username=misfinanzas;Password=misfinanzas"

      # Solo en local. En Cloud Run las migraciones las aplica el pipeline antes de desplegar,
      # porque el servicio puede levantar varias instancias a la vez.
      Database__AutoMigrate: "true"

      Firebase__ProjectId: "${FIREBASE_PROJECT_ID}"

      # En produccion no hace falta: Netlify reenvia /api/* al backend y comparten origen.
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "8081:8080"

volumes:
  misfinanzas-db:
