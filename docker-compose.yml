# Entorno local completo: base de datos, API y web. Un solo comando: docker compose up --build
#
# Este compose es SOLO para desarrollo en la maquina local. El del VPS es deploy/docker-compose.prod.yml
# y no comparte nada con este: alli la base de datos y el proxy los aporta Lactumama.
name: misfinanzas-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: misfinanzas
      POSTGRES_USER: misfinanzas
      POSTGRES_PASSWORD: misfinanzas
    ports:
      - "5433:5432"
    volumes:
      - misfinanzas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misfinanzas -d misfinanzas"]
      interval: 5s
      timeout: 5s
      retries: 10

  misfinanzas-api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=misfinanzas;Username=misfinanzas;Password=misfinanzas"

      # En local la propia API aplica las migraciones; en el VPS tambien, porque hay una sola replica.
      Database__AutoMigrate: "true"

      Firebase__ProjectId: "${FIREBASE_PROJECT_ID}"

      # Solo necesario si se levanta el frontend aparte con "npm run dev"; a traves de nginx
      # ambos comparten origen y CORS no interviene.
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "8081:8080"

  web:
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: "${VITE_FIREBASE_API_KEY}"
        VITE_FIREBASE_AUTH_DOMAIN: "${VITE_FIREBASE_AUTH_DOMAIN}"
        VITE_FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID}"
        VITE_FIREBASE_SENDER_ID: "${VITE_FIREBASE_SENDER_ID}"
        VITE_FIREBASE_APP_ID: "${VITE_FIREBASE_APP_ID}"
    depends_on:
      - misfinanzas-api
    ports:
      - "5174:80"

volumes:
  misfinanzas-db:
