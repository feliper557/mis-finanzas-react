name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# La región se elige por latencia desde Colombia, no por precio: la capa gratuita de Cloud Run
# no depende de la región.
env:
  GCP_REGION: us-east1
  SERVICIO: misfinanzas-api
  REPO_ARTEFACTOS: misfinanzas

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Las pruebas de integracion levantan PostgreSQL con Testcontainers, que usa el Docker
      # que ya trae el runner. Si alguna falla, no se despliega nada.
      - name: Probar
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # La SPA la despliega Netlify por su cuenta al detectar el push; aqui solo va la API.
  deploy:
    name: Desplegar la API en Cloud Run
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker contra Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Calcular el nombre de la imagen
        id: img
        run: |
          echo "ref=${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_ARTEFACTOS }}/api" >> "$GITHUB_OUTPUT"

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
            ${{ steps.img.outputs.ref }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Las migraciones se aplican AQUI, antes de publicar la revision nueva, y no al arrancar
      # la API: Cloud Run escala a cero y puede levantar varias instancias a la vez, que
      # competirian sobre el mismo esquema. Neon es accesible desde el runner, asi que este es
      # el unico punto donde la migracion ocurre una sola vez.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Aplicar migraciones en Neon
        working-directory: server
        env:
          ConnectionStrings__Default: ${{ secrets.NEON_CONNECTION_STRING }}
        run: |
          dotnet tool restore
          dotnet dotnet-ef database update --project src/MisFinanzas.Api

      - name: Desplegar en Cloud Run
        run: |
          gcloud run deploy "$SERVICIO" \
            --image "${{ steps.img.outputs.ref }}:${{ github.sha }}" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "misfinanzas-api@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 40 \
            --timeout 60s \
            --set-env-vars "ASPNETCORE_ENVIRONMENT=Production,Database__AutoMigrate=false,Firebase__ProjectId=${{ secrets.FIREBASE_PROJECT_ID }}" \
            --set-secrets "ConnectionStrings__Default=neon-connection-string:latest" \
            --quiet

      # --allow-unauthenticated abre el servicio a internet, pero no los datos: cada endpoint
      # exige un token valido de Firebase y filtra por el uid. Es la misma postura que tenia la
      # app con Firestore.
      #
      # --min-instances 0 es lo que mantiene la factura en cero a cambio de unos segundos de
      # arranque en frio. Subirlo a 1 elimina la espera y empieza a costar.
      #
      # --max-instances 2 acota tanto el gasto como las conexiones abiertas contra Neon.
      - name: Comprobar que la revision responde
        run: |
          URL=$(gcloud run services describe "$SERVICIO" --region "$GCP_REGION" --format 'value(status.url)')
          echo "Servicio en $URL"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "$URL/health"
