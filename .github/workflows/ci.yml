name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      # Las pruebas de integracion levantan PostgreSQL con Testcontainers, que usa el Docker
      # que ya trae el runner. Si alguna falla, el despliegue no ocurre.
      - name: Probar
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Desplegar en el VPS
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Los nombres de paquete de GHCR solo admiten minusculas y el del repositorio no
      # tiene por que estarlo, asi que se normaliza antes de etiquetar.
      - name: Calcular el nombre de las imagenes
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El driver por defecto de docker no sabe exportar cache; sin este paso, el
      # "cache-to: type=gha" de los dos builds siguientes aborta la construccion.
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # Ambas imagenes se construyen aqui y NUNCA en el servidor: compilar .NET o Vite en
      # 1 vCPU dejaria sin responder tambien a Lactumama, que comparte el mismo nucleo.
      - name: Construir y publicar la imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}/api:${{ github.sha }}
            ${{ steps.img.outputs.repo }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Vite incrusta las VITE_* en el paquete al compilar, por eso viajan como build args.
      # VITE_API_URL va vacio a proposito: la SPA y la API comparten origen tras nginx.
      - name: Construir y publicar la imagen del cliente
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_SENDER_ID=${{ vars.VITE_FIREBASE_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_API_URL=
          tags: |
            ${{ steps.img.outputs.repo }}/web:${{ github.sha }}
            ${{ steps.img.outputs.repo }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Con una unica replica, la API aplica las migraciones al arrancar (Database__AutoMigrate)
      # sin riesgo de que dos instancias migren a la vez.
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # La accion ya no admite script_stop, asi que el corte al primer fallo se pide aqui:
            # sin el, un pull fallido seguiria hasta el up y el despliegue se daria por bueno.
            set -eu

            # SOLO el proyecto misfinanzas. Ningun comando de este pipeline puede tocar
            # /opt/lactumama: la otra aplicacion no debe verse afectada en ningun momento.
            cd /opt/misfinanzas
            printf 'IMAGE_TAG=%s\n' "${{ github.sha }}" > .image-tag
            compose="docker compose --env-file .env --env-file .image-tag -f docker-compose.prod.yml"
            $compose pull
            $compose up -d --remove-orphans

            # Solo elimina imagenes colgantes (sin etiqueta y sin contenedor que las use), asi
            # que no puede afectar a nada que Lactumama tenga en marcha. Su propio pipeline
            # ejecuta exactamente lo mismo. NUNCA usar "docker system prune", que si borraria
            # redes y volumenes compartidos.
            docker image prune -f
