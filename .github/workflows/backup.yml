name: Respaldo de la base

# Neon hace sus propias copias, pero en la capa gratuita la ventana de recuperacion a un punto
# en el tiempo es corta y vive dentro del mismo proveedor. Esto es dinero: conviene tener un
# volcado logico propio, cifrado y fuera de Neon, que ademas permite restaurar en CUALQUIER
# PostgreSQL si algun dia hay que mudarse.

on:
  schedule:
    # 04:15 UTC, cada dia. Diario y no cada varios dias porque no cuesta nada (el volcado
    # comprimido ronda los 10 KB) y la ventana de perdida baja de tres dias a uno.
    #
    # OJO: GitHub DESACTIVA los flujos programados tras 60 dias sin actividad en el
    # repositorio. Avisa por correo y hay que reactivarlo a mano desde la pestana Actions.
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volcado:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # pg_dump tiene que ser de la MISMA version mayor que el servidor o se niega a trabajar.
      # Usar la imagen oficial evita depender de la version que traiga el runner.
      #
      # La cadena del secreto debe llevar "?sslmode=verify-full&sslrootcert=system" y el host
      # SIN "-pooler": libpq busca el certificado raiz en ~/.postgresql/root.crt y falla si no
      # se le dice que use el almacen del sistema, y el agrupador de Neon no admite algunas
      # operaciones del volcado.
      - name: Volcar la base
        env:
          CADENA: ${{ secrets.NEON_CONNECTION_STRING_PSQL }}
        run: |
          docker run --rm -e PGCONN="$CADENA" postgres:17-alpine \
            sh -c 'pg_dump --no-owner --no-privileges "$PGCONN"' | gzip > volcado.sql.gz
          ls -lh volcado.sql.gz

      # Un volcado vacio que se da por bueno es peor que no tener respaldo: el fallo solo se
      # descubre el dia que hay que restaurar. Si la conexion se corta a mitad, pg_dump puede
      # dejar un archivo valido pero incompleto, asi que se comprueban tamano y contenido.
      - name: Comprobar que el volcado tiene datos
        run: |
          BYTES=$(stat -c%s volcado.sql.gz)
          echo "tamano comprimido: $BYTES bytes"
          [ "$BYTES" -gt 1000 ] || { echo "El volcado es sospechosamente pequeno."; exit 1; }

          for TABLA in users months transactions categories saving_entries inv_items loans; do
            gunzip -c volcado.sql.gz | grep -q "CREATE TABLE public.$TABLA"               || { echo "Falta la tabla $TABLA en el volcado."; exit 1; }
          done

          COPIAS=$(gunzip -c volcado.sql.gz | grep -c '^COPY public\.' || true)
          echo "bloques COPY encontrados: $COPIAS"
          [ "$COPIAS" -ge 7 ] || { echo "Faltan bloques de datos."; exit 1; }
          echo "Volcado integro."


      # Se cifra antes de salir de este trabajo: un artefacto de GitHub lo puede descargar
      # cualquiera con acceso al repositorio, y esto es el historial financiero completo.
      - name: Cifrar
        env:
          DESTINATARIO: ${{ secrets.AGE_RECIPIENT }}
        run: |
          age --recipient "$DESTINATARIO" volcado.sql.gz > "misfinanzas-$(date +%F).sql.gz.age"
          rm volcado.sql.gz

      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_id }}
          path: '*.sql.gz.age'
          retention-days: 90

# Restaurar:
#   age --decrypt -i clave-privada.key misfinanzas-<fecha>.sql.gz.age | gunzip | psql "<cadena>"
#
# La clave PRIVADA de age se guarda fuera de GitHub (gestor de contrasenas). En los secretos
# del repositorio solo va la publica, en AGE_RECIPIENT: con ella se puede cifrar, no descifrar.
# Conviene probar una restauracion sobre una base desechable antes de necesitarla de verdad.
